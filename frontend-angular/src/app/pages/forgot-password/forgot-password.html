<app-auth-shell>
  <div class="card">
    <h2>Forgot your password?</h2>
    <p class="subtitle">Enter your email or mobile number and we'll send reset instructions.</p>

    @if (devResetToken) {
      <div class="devBanner">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <div>
          <strong>No email gateway configured (dev mode).</strong>
          <div><button type="button" class="linkBtn" (click)="useDevToken()">Continue to reset password</button></div>
        </div>
      </div>
    } @else if (message) {
      <div class="devBanner">
        <svg class="icon" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>{{ message }}</div>
      </div>
    }

    <form (ngSubmit)="submit()" #form="ngForm">
      <div class="formGroup">
        <label for="identifier">Email or mobile number</label>
        <input id="identifier" name="identifier" type="text" [(ngModel)]="identifier" required />
      </div>

      <button type="submit" class="primaryBtn" [disabled]="loading() || form.invalid">
        @if (loading()) {
          <span class="spinner"></span>
        }
        Send reset instructions
      </button>
    </form>

    <p class="formFooter"><a routerLink="/login">Back to login</a></p>
  </div>
</app-auth-shell>
