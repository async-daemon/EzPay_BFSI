<div class="tabBar">
  <button type="button" [class.active]="tab() === 'upi'" (click)="tab.set('upi')">Send via UPI</button>
  <button type="button" [class.active]="tab() === 'bank'" (click)="tab.set('bank')">Bank Transfer</button>
  <button type="button" [class.active]="tab() === 'add-account'" (click)="tab.set('add-account')">Add Bank Account</button>
</div>

@if (tab() === 'upi') {
  <div class="panel" style="max-width: 460px;">
    <h2>Send via UPI</h2>
    <form (ngSubmit)="payUpi()" #form="ngForm">
      <div class="formGroup">
        <label for="upiRecipient">Recipient UPI ID</label>
        <input id="upiRecipient" name="upiRecipient" type="text" [(ngModel)]="upiRecipient" required placeholder="name@bank" />
      </div>
      <div class="formGroup">
        <label for="upiAmount">Amount (₹)</label>
        <input id="upiAmount" name="upiAmount" type="number" min="0.01" step="0.01" [(ngModel)]="upiAmount" required />
      </div>
      <div class="formGroup">
        <label for="upiNote">Note (optional)</label>
        <input id="upiNote" name="upiNote" type="text" [(ngModel)]="upiNote" maxlength="255" />
      </div>
      <button type="submit" class="primaryBtn" [disabled]="upiLoading() || form.invalid">
        @if (upiLoading()) { <span class="spinner"></span> }
        Pay now
      </button>
    </form>
  </div>
}

@if (tab() === 'bank') {
  <div class="panel" style="max-width: 460px;">
    <h2>Bank Transfer</h2>
    @if (bankAccounts().length === 0) {
      <div class="emptyState">
        <p>Add a bank account first to send a transfer.</p>
      </div>
    } @else {
      <form (ngSubmit)="payBankTransfer()" #form="ngForm">
        <div class="formGroup">
          <label for="fromAccountId">From account</label>
          <select id="fromAccountId" name="fromAccountId" [(ngModel)]="fromAccountId" required>
            <option value="" disabled selected>Choose an account</option>
            @for (acc of bankAccounts(); track acc.accountId) {
              <option [value]="acc.accountId">{{ acc.accountHolderName }} — {{ acc.maskedAccountNumber }}</option>
            }
          </select>
        </div>
        <div class="formRow">
          <div class="formGroup">
            <label for="recipientAccountNumber">Recipient account number</label>
            <input id="recipientAccountNumber" name="recipientAccountNumber" type="text" [(ngModel)]="recipientAccountNumber" required />
          </div>
          <div class="formGroup">
            <label for="recipientIfscCode">Recipient IFSC</label>
            <input id="recipientIfscCode" name="recipientIfscCode" type="text" [(ngModel)]="recipientIfscCode" required minlength="11" maxlength="11" style="text-transform: uppercase;" />
          </div>
        </div>
        <div class="formGroup">
          <label for="transferAmount">Amount (₹)</label>
          <input id="transferAmount" name="transferAmount" type="number" min="0.01" step="0.01" [(ngModel)]="transferAmount" required />
        </div>
        <div class="formGroup">
          <label for="transferPurpose">Purpose (optional)</label>
          <input id="transferPurpose" name="transferPurpose" type="text" [(ngModel)]="transferPurpose" maxlength="255" />
        </div>
        <button type="submit" class="primaryBtn" [disabled]="transferLoading() || form.invalid">
          @if (transferLoading()) { <span class="spinner"></span> }
          Transfer now
        </button>
      </form>
    }
  </div>
}

@if (tab() === 'add-account') {
  <div class="panel" style="max-width: 460px;">
    <h2>Add Bank Account</h2>
    <form (ngSubmit)="addBankAccount()" #form="ngForm">
      <div class="formGroup">
        <label for="newAccountNumber">Account number</label>
        <input id="newAccountNumber" name="newAccountNumber" type="text" [(ngModel)]="newAccountNumber" required minlength="6" maxlength="34" />
      </div>
      <div class="formGroup">
        <label for="newIfscCode">IFSC code</label>
        <input id="newIfscCode" name="newIfscCode" type="text" [(ngModel)]="newIfscCode" required minlength="11" maxlength="11" style="text-transform: uppercase;" />
      </div>
      <div class="formGroup">
        <label for="newAccountHolderName">Account holder name</label>
        <input id="newAccountHolderName" name="newAccountHolderName" type="text" [(ngModel)]="newAccountHolderName" required />
      </div>
      <button type="submit" class="primaryBtn" [disabled]="addAccountLoading() || form.invalid">
        @if (addAccountLoading()) { <span class="spinner"></span> }
        Add account
      </button>
    </form>
  </div>
}
