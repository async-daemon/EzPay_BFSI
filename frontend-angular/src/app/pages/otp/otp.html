<app-auth-shell>
  <div class="card">
    <h2>Verify your mobile number</h2>
    <p class="subtitle">Enter the 6-digit code sent to {{ mobileNumber }}.</p>

    @if (devOtp) {
      <div class="devBanner">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <div>
          <strong>No SMS gateway configured (dev mode).</strong>
          <div>Your code is <span class="devCode">{{ devOtp }}</span> — <button type="button" class="linkBtn" (click)="useDevCode()">use it</button></div>
        </div>
      </div>
    }

    <form (ngSubmit)="submit()" #form="ngForm">
      <div class="formGroup">
        <label for="otp">Verification code</label>
        <input id="otp" name="otp" type="text" inputmode="numeric" maxlength="6" [(ngModel)]="otp" required pattern="^[0-9]{6}$" />
      </div>

      <button type="submit" class="primaryBtn" [disabled]="loading() || form.invalid">
        @if (loading()) {
          <span class="spinner"></span>
        }
        Verify &amp; continue
      </button>
    </form>

    <p class="formFooter"><a routerLink="/register">Start over</a></p>
  </div>
</app-auth-shell>
