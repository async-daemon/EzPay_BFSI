# EzPay backend (Java/Spring MVC/Hibernate) default configuration.
# Every value below can be overridden by an environment variable using Spring
# Boot's relaxed binding, e.g. EZPAY_JWT_SECRET overrides ezpay.jwt.secret.

server.port=${PORT:8081}

# --- Database (default: H2, file-based, zero setup — mirrors the Python
# build's SQLite default). Switch to Oracle with --spring.profiles.active=oracle
# (see application-oracle.properties) without any code change. ---
spring.datasource.url=jdbc:h2:file:./ezpaydb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Security / app settings ---
ezpay.jwt.secret=${EZPAY_JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
ezpay.jwt.access-token-expire-minutes=${EZPAY_ACCESS_TOKEN_EXPIRE_MINUTES:30}
ezpay.field-encryption-key=${EZPAY_FIELD_ENCRYPTION_KEY:}
ezpay.cors-origins=${EZPAY_CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Jackson: serialize LocalDateTime as ISO-8601 strings, not arrays, so the
# Angular frontend can parse them with plain `new Date(...)`.
spring.jackson.serialization.write-dates-as-timestamps=false
