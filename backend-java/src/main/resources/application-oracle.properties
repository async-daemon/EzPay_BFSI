# Activate with: java -jar target/backend-1.0.0.jar --spring.profiles.active=oracle
# (or SPRING_PROFILES_ACTIVE=oracle). Points Hibernate at a real Oracle
# instance instead of the default H2 file — e.g. the free "gvenzl/oracle-free"
# Docker image, or any Oracle 11g+ server.
#
# docker run -d --name ezpay-oracle -p 1521:1521 -e ORACLE_PASSWORD=ezpay_dev_pw gvenzl/oracle-free:slim

spring.datasource.url=${EZPAY_ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${EZPAY_ORACLE_USER:ezpay}
spring.datasource.password=${EZPAY_ORACLE_PASSWORD:ezpay_dev_pw}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
